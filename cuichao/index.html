<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>崔超的小站</title>
  <meta name="description" content="崔超的小站：作品、记录与学习收藏，一页浏览。">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="profile">
          <div class="avatar" id="avatar" aria-hidden="true">崔</div>
          <div class="profile-meta">
            <h1 class="site-name" id="siteName">崔超的小站</h1>
            <p class="site-tagline" id="siteTagline">把喜欢的东西，留在这里。</p>
          </div>
        </div>

        <nav class="nav" id="nav" aria-label="主导航"></nav>
      </div>

      <div class="sidebar-bottom">
        <div class="theme-box">
          <span class="theme-label">主题</span>
          <div class="theme-options" id="themeOptions" role="group" aria-label="主题设置">
            <button type="button" class="theme-btn" data-theme="dark">深色</button>
            <button type="button" class="theme-btn" data-theme="light">浅色</button>
            <button type="button" class="theme-btn" data-theme="system">跟随系统</button>
          </div>
        </div>
        <div class="sidebar-foot" id="sidebarFoot"></div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="menu-toggle" id="menuToggle" type="button" aria-label="展开导航">☰</button>
          <div class="breadcrumb" id="breadcrumb" aria-label="面包屑"></div>
        </div>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
          <input id="searchInput" type="search" placeholder="搜索…" autocomplete="off" aria-label="搜索站内内容">
        </div>
      </header>

      <main class="content" id="view" aria-live="polite"></main>

      <footer class="footer" id="footer"></footer>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="scrim" id="scrim" hidden></div>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
